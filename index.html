<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleria fotografica</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Galleria fotografica</h1>
    <p>Clicca su una foto per ingrandirla.</p>
  </header>

  <main>
    <ul class="gallery" id="gallery"></ul>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Immagine ingrandita" hidden>
    <div class="lightbox__overlay" id="lightboxOverlay"></div>
    <div class="lightbox__content">
      <button type="button" class="lightbox__close" id="lightboxClose" aria-label="Chiudi">&times;</button>
      <button type="button" class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="Foto precedente">&#8249;</button>
      <img class="lightbox__image" id="lightboxImage" src="" alt="">
      <button type="button" class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="Foto successiva">&#8250;</button>
    </div>
  </div>

  <script src="js/photos.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
